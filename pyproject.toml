[project]
name = "transport"
authors = [
    { name = "M. Zain Ul Abideen", email = "m.zain00727@gmail.com"}
]
description = "This app is used to account the transport system of a company, and it requires fleetify app to work"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

# The traffic-fine fetchers drive a real browser. Deliberately NOT a base
# dependency: most sites installing this app never fetch fines, and the browser
# belongs in a sidecar rather than in the ERP runtime. Declaring it as an extra
# still pins the version and makes the install a named step:
#
#     ./env/bin/pip install -e "apps/transport[fines]"
#     ./env/bin/playwright install chromium
#
# The second command is not packaging - Chromium is a browser binary Playwright
# downloads, not a Python distribution - so it can never be listed here.
# Developed and tested against playwright 1.62.
[project.optional-dependencies]
fines = [
    "playwright>=1.40,<2",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
#
# Left empty on purpose. The only apt packages this app needs are the shared
# libraries and fonts Chromium links against, and that set differs by Ubuntu
# release - pinning a guessed list here would rot silently and be wrong on the
# next LTS. `sudo ./env/bin/playwright install-deps chromium` resolves it for
# the distro it is actually running on, which is the supported way to do it.
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
