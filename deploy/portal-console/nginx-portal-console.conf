# noVNC console for the traffic-portal sign-in browser.
#
# Copy to /etc/nginx/sites-available/, replace CONSOLE_HOSTNAME and ERP_ORIGIN,
# symlink into sites-enabled, `nginx -t`, reload.
#
# This file is the only part of the stack on the public network. Xvfb, x11vnc
# and websockify are all bound to 127.0.0.1 and must stay that way.

server {
	listen 80;
	server_name CONSOLE_HOSTNAME;
	# Nothing is served over plain HTTP: the password and the signed-in screen
	# both cross this connection.
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	server_name CONSOLE_HOSTNAME;

	ssl_certificate     /etc/letsencrypt/live/CONSOLE_HOSTNAME/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/CONSOLE_HOSTNAME/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	add_header X-Robots-Tag "noindex, nofollow" always;
	add_header Referrer-Policy "no-referrer" always;

	# Replace ERP_ORIGIN with the ERPNext site's own host. This is what lets
	# the "Authenticate Traffic Portal" modal embed the console while refusing
	# every other site the same thing. Omit the header and browsers apply no
	# restriction at all; set it to 'none' and the ERP modal renders blank.
	add_header Content-Security-Policy "frame-ancestors https://ERP_ORIGIN" always;

	auth_basic "Portal Sign-In Console";
	auth_basic_user_file /etc/portal-console/htpasswd;

	location / {
		proxy_pass http://127.0.0.1:6080;
		proxy_http_version 1.1;

		# websockify speaks WebSocket. Without these three the page loads and
		# the screen stays black, which reads as a broken display rather than
		# as a proxy that dropped the upgrade.
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;

		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# A sign-in is minutes of a person reading a screen, and the default
		# 60-second read timeout closes the socket under them.
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
